<script>
  const clientId = "8d785af0123941a4ac5605651a22b7a4";
  const redirectUri = "https://coderich0.github.io/office-jukebox-widget/";
  const scopes = "user-read-playback-state user-read-currently-playing";

  function login() {
    const authUrl =
      "https://accounts.spotify.com/authorize" +
      "?response_type=code" +
      "&client_id=" + clientId +
      "&scope=" + encodeURIComponent(scopes) +
      "&redirect_uri=" + encodeURIComponent(redirectUri);

    window.location = authUrl;
  }

  function getCodeFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("code");
  }

  async function sendCodeToPowerAutomate() {
    const code = getCodeFromUrl();

    if (!code) {
      console.log("No Spotify code found");
      return;
    }

    console.log("Spotify code found:", code);

    try {
      const response = await fetch("https://default5b2904670c6a4efc97f67635224fb5.b1.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d8efffa6b7df41e7823f2d04aac2b571/triggers/manual/paths/invoke?api-version=1", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ code })
      });

      console.log("Sent to Power Automate");

      document.getElementById("status").innerText =
        "Spotify connected ✔";
    }
    catch (err) {
      console.error(err);

      document.getElementById("status").innerText =
        "Connection failed";
    }
  }

  window.onload = sendCodeToPowerAutomate;
</script>
