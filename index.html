<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Office Jukebox</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #121212;
      color: white;
      padding: 40px;
    }

    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      margin: auto;
    }

    img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      background: #1db954;
      border: none;
      padding: 12px 20px;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>🎵 Office Jukebox</h1>

  <div class="card">
    <h2>Send request to DJ system</h2>
    <p id="status">Waiting for login...</p>

    <button onclick="login()">Login with Spotify</button>
  </div>

  <script>
    const clientId = "8d785af0123941a4ac5605651a22b7a4";
    const redirectUri = "https://coderich0.github.io/office-jukebox-widget/";
    const scopes = "user-read-playback-state user-read-currently-playing";

    function login() {
      const authUrl =
        "https://accounts.spotify.com/authorize" +
        "?response_type=code" +
        "&client_id=" + clientId +
        "&scope=" + encodeURIComponent(scopes) +
        "&redirect_uri=" + encodeURIComponent(redirectUri);

      window.location = authUrl;
    }

    function getCodeFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("code");
    }

    async function sendCodeToBackend() {
      const code = getCodeFromUrl();

      if (!code) return;

      document.getElementById("status").innerText =
        "Login successful. Sending to system...";

      await fetch("https://default5b2904670c6a4efc97f67635224fb5.b1.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/78a36a48584c4dd890ead7f7e0dc67c8/triggers/manual/paths/invoke?api-version=1", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ code })
      });

      document.getElementById("status").innerText =
        "Sent to DJ system ✔";
    }

    window.onload = sendCodeToBackend;
  </script>

</body>
</html>
