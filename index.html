<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Office Jukebox</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #121212;
      color: white;
      padding: 40px;
    }

    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 340px;
      margin: auto;
    }

    button {
      background: #1db954;
      border: none;
      padding: 12px 20px;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 14px;
    }

    #status {
      margin-top: 15px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>🎵 Office Jukebox</h1>

  <div class="card">

    <p id="status">Waiting for Spotify login...</p>

    <button onclick="login()">Login with Spotify</button>

  </div>

  <script>
    const clientId = "8d785af0123941a4ac5605651a22b7a4";
    const redirectUri = "https://coderich0.github.io/office-jukebox-widget/";
    const scopes = "user-read-playback-state user-read-currently-playing";

    // 1. LOGIN
    function login() {
      const authUrl =
        "https://accounts.spotify.com/authorize" +
        "?response_type=code" +
        "&client_id=" + clientId +
        "&scope=" + encodeURIComponent(scopes) +
        "&redirect_uri=" + encodeURIComponent(redirectUri);

      window.location = authUrl;
    }

    // 2. GET CODE FROM URL
    function getCodeFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("code");
    }

    // 3. SEND CODE TO POWER AUTOMATE
    async function sendCodeToPowerAutomate() {
      const code = getCodeFromUrl();

      if (!code) {
        console.log("No Spotify code found");
        return;
      }

      document.getElementById("status").innerText =
        "Spotify login detected... sending to system";

      try {
        await fetch("https://default5b2904670c6a4efc97f67635224fb5.b1.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/1e5a2a0aa5f044ee86e3446a04d8965d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OsKqKdZJVFfQ9cwzrcNsasugEaRq4edwcVfjv_udtvM", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code })
        });

        document.getElementById("status").innerText =
          "Connected ✔ (DJ system active)";
      }
      catch (err) {
        console.error(err);
        document.getElementById("status").innerText =
          "Connection failed";
      }
    }

    // 4. RUN ON PAGE LOAD
    window.onload = sendCodeToPowerAutomate;
  </script>

</body>
</html>
